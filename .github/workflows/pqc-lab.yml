name: PQC course lab
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['labs/pqc/**', '.github/workflows/pqc-lab.yml']
  pull_request:
    paths: ['labs/pqc/**', '.github/workflows/pqc-lab.yml']
permissions:
  contents: read
jobs:
  container-functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned OpenSSL laboratory
        run: docker build -f labs/pqc/Dockerfile -t pqc-course-lab .
      - name: Run isolated functional and negative tests
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=128m pqc-course-lab
