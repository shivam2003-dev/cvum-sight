name: Site integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shared-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shared asset versions
        run: node scripts/check-shared-assets.mjs

      - name: Validate shared JavaScript syntax
        run: |
          node --check scripts/check-shared-assets.mjs
          node --check site/theme-init.js
          node --check site/settings.js
          node --check site/app.js
          node --check site/modern.js
          node --check site/reader.js
