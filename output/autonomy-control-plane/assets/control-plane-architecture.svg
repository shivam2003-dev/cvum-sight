<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Two-plane architecture for long-horizon autonomous development</title>
  <desc id="desc">A probabilistic cognition plane proposes actions while a deterministic control plane authorizes, records, verifies, and recovers them.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060e1a"/><stop offset="1" stop-color="#11172a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5eead4"/></marker><style>.h{font:700 34px Inter,system-ui;fill:#f8fbff}.s{font:500 18px Inter,system-ui;fill:#9eafc6}.ph{font:700 22px Inter,system-ui;fill:#fff}.t{font:700 18px Inter,system-ui;fill:#eff6ff}.b{font:500 15px Inter,system-ui;fill:#b4c0d1}.box{fill:#111d30;stroke:#334762;stroke-width:2}.arrow{fill:none;stroke:#5eead4;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="900" rx="30" fill="url(#bg)"/>
  <text class="h" x="65" y="72">Autonomy is a control-plane design</text><text class="s" x="65" y="106">Keep creative inference replaceable; make authority and truth deterministic</text>
  <rect x="55" y="145" width="1290" height="255" rx="24" fill="#121529" stroke="#7c6cf2" stroke-width="2"/>
  <text x="85" y="184" class="ph">Probabilistic cognition plane</text><text x="1110" y="184" class="s">replaceable models</text>
  <g><rect class="box" x="85" y="220" width="210" height="120" rx="18"/><text class="t" x="110" y="258">Context composer</text><text class="b" x="110" y="288">instructions · repo map</text><text class="b" x="110" y="312">memory · observations</text></g>
  <g><rect class="box" x="345" y="220" width="210" height="120" rx="18"/><text class="t" x="370" y="258">Planner</text><text class="b" x="370" y="288">hypotheses · DAG</text><text class="b" x="370" y="312">risk-aware next step</text></g>
  <g><rect class="box" x="605" y="220" width="210" height="120" rx="18"/><text class="t" x="630" y="258">Executor policy</text><text class="b" x="630" y="288">tool selection</text><text class="b" x="630" y="312">bounded arguments</text></g>
  <g><rect class="box" x="865" y="220" width="210" height="120" rx="18"/><text class="t" x="890" y="258">Critic</text><text class="b" x="890" y="288">counterexamples</text><text class="b" x="890" y="312">uncertainty update</text></g>
  <g><rect class="box" x="1125" y="220" width="180" height="120" rx="18"/><text class="t" x="1150" y="258">Summarizer</text><text class="b" x="1150" y="288">bounded state</text><text class="b" x="1150" y="312">not authority</text></g>
  <path class="arrow" d="M295 280H335"/><path class="arrow" d="M555 280H595"/><path class="arrow" d="M815 280H855"/><path class="arrow" d="M1075 280H1115"/>
  <rect x="55" y="455" width="1290" height="350" rx="24" fill="#0b1b27" stroke="#5eead4" stroke-width="2"/>
  <text x="85" y="496" class="ph">Deterministic control plane</text><text x="1078" y="496" class="s">system of record</text>
  <g><rect class="box" x="85" y="535" width="225" height="105" rx="18"/><text class="t" x="110" y="571">Policy engine</text><text class="b" x="110" y="600">capabilities · approvals</text><text class="b" x="110" y="622">immutable deny rules</text></g>
  <g><rect class="box" x="350" y="535" width="225" height="105" rx="18"/><text class="t" x="375" y="571">Durable workflow</text><text class="b" x="375" y="600">event log · idempotency</text><text class="b" x="375" y="622">leases · heartbeats</text></g>
  <g><rect class="box" x="615" y="535" width="225" height="105" rx="18"/><text class="t" x="640" y="571">Tool runtime</text><text class="b" x="640" y="600">sandbox · network</text><text class="b" x="640" y="622">timeouts · resource caps</text></g>
  <g><rect class="box" x="880" y="535" width="225" height="105" rx="18"/><text class="t" x="905" y="571">Verification mesh</text><text class="b" x="905" y="600">tests · static analysis</text><text class="b" x="905" y="622">screenshots · telemetry</text></g>
  <g><rect class="box" x="1145" y="535" width="160" height="105" rx="18"/><text class="t" x="1170" y="571">Evidence</text><text class="b" x="1170" y="600">receipts</text><text class="b" x="1170" y="622">provenance</text></g>
  <path class="arrow" d="M310 587H340"/><path class="arrow" d="M575 587H605"/><path class="arrow" d="M840 587H870"/><path class="arrow" d="M1105 587H1135"/>
  <rect x="350" y="684" width="490" height="80" rx="16" fill="#101827" stroke="#ffb454"/><text class="t" x="375" y="716">Recovery manager</text><text class="b" x="375" y="743">checkpoint · replay · compensate · quarantine</text>
  <path d="M595 684V650" stroke="#ffb454" stroke-width="3"/><path d="M725 684V650" stroke="#ffb454" stroke-width="3"/>
  <path class="arrow" d="M710 400V445"/><path class="arrow" d="M990 640C990 735 970 790 720 810C410 835 195 735 195 650"/>
  <text class="b" x="870" y="778">observations return as evidence, never as implicit truth</text>
  <text class="s" x="65" y="862">Invariant: the model may propose a mutation; only the control plane may authorize and commit it.</text>
</svg>
