<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Evolution from completion models to durable autonomous development</title>
  <desc id="desc">A timeline showing the architectural shift from token completion through chat, tool use, repository agents, durable workflows, and governed autonomy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#11182b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .h{font:700 34px Inter,system-ui,sans-serif;fill:#f7fbff}.s{font:500 18px Inter,system-ui,sans-serif;fill:#9fb2c8}.y{font:700 17px ui-monospace,monospace;fill:#65e6d1}.t{font:700 20px Inter,system-ui,sans-serif;fill:#f4f8ff}.b{font:500 16px Inter,system-ui,sans-serif;fill:#b9c7d8}.line{stroke:#334562;stroke-width:5;stroke-linecap:round}.node{fill:#111d31;stroke:#31415e;stroke-width:2}.accent{fill:#65e6d1;filter:url(#glow)}
    </style>
  </defs>
  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <text class="h" x="70" y="80">The unit of progress changed</text>
  <text class="s" x="70" y="115">From predicting a line to maintaining a recoverable, governed state machine</text>
  <line class="line" x1="110" y1="345" x2="1290" y2="345"/>
  <g transform="translate(90 0)">
    <circle class="accent" cx="60" cy="345" r="11"/><rect class="node" x="0" y="175" width="220" height="125" rx="18"/>
    <text class="y" x="20" y="208">2018–2020</text><text class="t" x="20" y="241">Completion</text><text class="b" x="20" y="270">unit: token / function</text>
    <path d="M60 300V334" stroke="#65e6d1" stroke-width="3"/>
  </g>
  <g transform="translate(330 0)">
    <circle class="accent" cx="60" cy="345" r="11"/><rect class="node" x="0" y="390" width="220" height="125" rx="18"/>
    <text class="y" x="20" y="423">2021–2022</text><text class="t" x="20" y="456">Chat + retrieval</text><text class="b" x="20" y="485">unit: conversation</text>
    <path d="M60 356V390" stroke="#65e6d1" stroke-width="3"/>
  </g>
  <g transform="translate(570 0)">
    <circle class="accent" cx="60" cy="345" r="11"/><rect class="node" x="0" y="175" width="220" height="125" rx="18"/>
    <text class="y" x="20" y="208">2023</text><text class="t" x="20" y="241">Tool loop</text><text class="b" x="20" y="270">unit: action → result</text>
    <path d="M60 300V334" stroke="#65e6d1" stroke-width="3"/>
  </g>
  <g transform="translate(810 0)">
    <circle class="accent" cx="60" cy="345" r="11"/><rect class="node" x="0" y="390" width="220" height="125" rx="18"/>
    <text class="y" x="20" y="423">2024–2025</text><text class="t" x="20" y="456">Repository agent</text><text class="b" x="20" y="485">unit: tested patch</text>
    <path d="M60 356V390" stroke="#65e6d1" stroke-width="3"/>
  </g>
  <g transform="translate(1050 0)">
    <circle cx="60" cy="345" r="16" fill="#ffb454" filter="url(#glow)"/><rect x="0" y="165" width="260" height="145" rx="18" fill="#171d32" stroke="#ffb454" stroke-width="2"/>
    <text x="20" y="200" font-family="ui-monospace,monospace" font-size="17" font-weight="700" fill="#ffb454">2026 →</text><text class="t" x="20" y="235">Durable autonomy</text>
    <text class="b" x="20" y="265">unit: evidence-backed</text><text class="b" x="20" y="288">state transition</text><path d="M60 310V329" stroke="#ffb454" stroke-width="3"/>
  </g>
  <rect x="70" y="610" width="1260" height="85" rx="18" fill="#0c1728" stroke="#2b3b55"/>
  <text class="t" x="105" y="648">Surprising consequence</text><text class="b" x="105" y="678">Model quality still matters, but system reliability is increasingly determined by what survives crashes, compaction, retries, and operator absence.</text>
</svg>
