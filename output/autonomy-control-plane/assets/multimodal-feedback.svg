<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Multimodal residual control loop</title><desc id="desc">Screenshots, DOM state, tests, logs, metrics, and traces are fused into observations and compared against predicted outcomes.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#07101d"/><stop offset="1" stop-color="#11182b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#5eead4"/></marker><style>.h{font:700 34px Inter,system-ui;fill:#f7fbff}.s{font:500 17px Inter,system-ui;fill:#a9b7ca}.t{font:700 19px Inter,system-ui;fill:#f1f6fd}.b{font:500 15px Inter,system-ui;fill:#b6c2d1}.c{fill:#101c2f;stroke:#344762;stroke-width:2}.a{fill:none;stroke:#5eead4;stroke-width:3;marker-end:url(#a)}.warn{fill:none;stroke:#ffb454;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="820" rx="30" fill="url(#bg)"/><text class="h" x="65" y="75">Vision is useful only when it closes the loop</text><text class="s" x="65" y="110">Treat rendered pixels as one sensor among several; compare observation with a predicted state</text>
  <circle cx="700" cy="435" r="155" fill="#0c192a" stroke="#5eead4" stroke-width="3"/>
  <text class="t" x="615" y="405">Residual engine</text><text x="607" y="446" font-family="ui-monospace,monospace" font-size="19" font-weight="600" fill="#8ff0de">rₜ = yₜ − ŷₜ</text><text class="b" x="600" y="480">fuse · attribute · decide</text>
  <g transform="translate(90 190)"><rect class="c" width="240" height="115" rx="18"/><text class="t" x="25" y="45">Visual sensor</text><text class="b" x="25" y="75">screenshots · video</text><text class="b" x="25" y="98">layout · color · occlusion</text></g>
  <g transform="translate(90 555)"><rect class="c" width="240" height="115" rx="18"/><text class="t" x="25" y="45">Semantic sensor</text><text class="b" x="25" y="75">DOM · accessibility tree</text><text class="b" x="25" y="98">API response · schema</text></g>
  <g transform="translate(1070 190)"><rect class="c" width="240" height="115" rx="18"/><text class="t" x="25" y="45">Runtime sensor</text><text class="b" x="25" y="75">tests · logs · traces</text><text class="b" x="25" y="98">latency · resource state</text></g>
  <g transform="translate(1070 555)"><rect class="c" width="240" height="115" rx="18"/><text class="t" x="25" y="45">External oracle</text><text class="b" x="25" y="75">user-visible endpoint</text><text class="b" x="25" y="98">independent evaluator</text></g>
  <g transform="translate(515 170)"><rect width="370" height="75" rx="16" fill="#161a2d" stroke="#7c6cf2" stroke-width="2"/><text class="t" x="30" y="34">Predicted observation ŷₜ</text><text class="b" x="30" y="58">what success should look like before acting</text></g>
  <g transform="translate(515 645)"><rect width="370" height="92" rx="16" fill="#171d2d" stroke="#ffb454" stroke-width="2"/><text class="t" x="30" y="37">Controller decision</text><text class="b" x="30" y="64">accept · retry · repair · rollback · escalate</text></g>
  <path class="a" d="M330 247C475 247 500 320 560 350"/><path class="a" d="M330 612C475 612 500 545 560 515"/><path class="a" d="M1070 247C925 247 900 320 840 350"/><path class="a" d="M1070 612C925 612 900 545 840 515"/>
  <path class="a" d="M700 245V270"/><path class="warn" d="M700 590V635"/><path class="a" d="M885 691C1020 760 1230 750 1310 670"/>
  <rect x="365" y="765" width="670" height="36" rx="12" fill="#0d1828"/><text class="b" x="400" y="789">Pixels detect appearance; structured state explains causality. Production agents need both.</text>
</svg>
