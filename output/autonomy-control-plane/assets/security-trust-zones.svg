<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Trust zones for an autonomous coding system</title><desc id="d">Untrusted inputs are separated from planning, sandboxed execution, secrets, and release authority.</desc><defs><linearGradient id="b"><stop stop-color="#08101d"/><stop offset="1" stop-color="#17142b"/></linearGradient></defs><rect width="1400" height="800" rx="28" fill="url(#b)"/><text x="70" y="75" fill="#eef4ff" font-family="Inter,Arial" font-size="34" font-weight="700">Trust boundaries are part of the reasoning architecture</text>
<g font-family="Inter,Arial"><rect x="65" y="130" width="275" height="530" rx="25" fill="#28151d" stroke="#fb7185"/><text x="100" y="180" fill="#fda4af" font-size="20">ZONE 0 · UNTRUSTED</text><text x="100" y="232" fill="#e6edf7" font-size="21">issues · web · images</text><text x="100" y="272" fill="#e6edf7" font-size="21">dependency output</text><text x="100" y="312" fill="#e6edf7" font-size="21">test logs · docs</text><path d="M110 385h185M110 430h145M110 475h170" stroke="#713548" stroke-width="9" stroke-linecap="round"/><text x="100" y="565" fill="#fda4af" font-size="17">data, never authority</text>
<rect x="410" y="130" width="280" height="530" rx="25" fill="#13213a" stroke="#60a5fa"/><text x="445" y="180" fill="#93c5fd" font-size="20">ZONE 1 · COGNITION</text><text x="445" y="232" fill="#e6edf7" font-size="21">planner + model</text><text x="445" y="272" fill="#e6edf7" font-size="21">read-only context</text><text x="445" y="312" fill="#e6edf7" font-size="21">taint labels</text><rect x="452" y="372" width="195" height="86" rx="18" fill="#172b4a"/><text x="480" y="410" fill="#bfdbfe" font-size="18">policy proposal</text><text x="480" y="438" fill="#759ac7" font-size="15">not a capability</text>
<rect x="760" y="130" width="280" height="530" rx="25" fill="#102922" stroke="#34d399"/><text x="795" y="180" fill="#6ee7b7" font-size="20">ZONE 2 · SANDBOX</text><text x="795" y="232" fill="#e6edf7" font-size="21">ephemeral identity</text><text x="795" y="272" fill="#e6edf7" font-size="21">worktree + limits</text><text x="795" y="312" fill="#e6edf7" font-size="21">egress allowlist</text><text x="795" y="352" fill="#e6edf7" font-size="21">artifact scanner</text><circle cx="900" cy="455" r="64" fill="#12392e" stroke="#34d399"/><path d="M870 457l21 21 40-50" fill="none" stroke="#6ee7b7" stroke-width="10"/>
<rect x="1110" y="130" width="225" height="530" rx="25" fill="#2b2412" stroke="#fbbf24"/><text x="1142" y="180" fill="#fde68a" font-size="20">ZONE 3 · AUTHORITY</text><text x="1142" y="232" fill="#e6edf7" font-size="20">secret broker</text><text x="1142" y="272" fill="#e6edf7" font-size="20">merge token</text><text x="1142" y="312" fill="#e6edf7" font-size="20">deploy signer</text><rect x="1150" y="382" width="145" height="98" rx="18" fill="#3a2d12"/><text x="1178" y="420" fill="#fde68a" font-size="18">short lease</text><text x="1178" y="450" fill="#a98b48" font-size="15">scoped + revocable</text></g>
<g fill="none" stroke-width="5"><path d="M340 395h70" stroke="#fb7185"/><path d="M690 395h70" stroke="#60a5fa"/><path d="M1040 395h70" stroke="#34d399"/></g><g fill="#08101d" stroke="#eef4ff" stroke-width="3"><path d="M365 371h26v49h-26z"/><path d="M715 371h26v49h-26z"/><path d="M1065 371h26v49h-26z"/></g>
<text x="70" y="730" fill="#899cb5" font-family="Inter,Arial" font-size="18">No prompt crosses a boundary by itself: only a policy decision can mint a narrow, expiring capability.</text></svg>
