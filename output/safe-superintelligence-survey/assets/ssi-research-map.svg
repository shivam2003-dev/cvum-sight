<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Safe superintelligence research map</title><desc id="d">A dark systems map connects specification, scalable oversight, interpretability, evaluations, deployment controls, and governance to an assurance case.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17122c"/></linearGradient></defs><rect width="1400" height="760" rx="28" fill="url(#g)"/><text x="70" y="75" fill="#f0f7ff" font-family="Inter,Arial" font-size="34" font-weight="700">Safe superintelligence is an assurance stack, not a model label</text><text x="70" y="112" fill="#90a9c4" font-family="Inter,Arial" font-size="17">Each layer produces evidence; no single layer can certify the whole system.</text><g font-family="Inter,Arial"><g stroke-width="3"><rect x="80" y="205" width="215" height="120" rx="19" fill="#112942" stroke="#38bdf8"/><rect x="80" y="435" width="215" height="120" rx="19" fill="#2c1a38" stroke="#e879f9"/><rect x="415" y="150" width="235" height="120" rx="19" fill="#112e25" stroke="#34d399"/><rect x="415" y="490" width="235" height="120" rx="19" fill="#302610" stroke="#fbbf24"/><rect x="770" y="150" width="235" height="120" rx="19" fill="#112942" stroke="#60a5fa"/><rect x="770" y="490" width="235" height="120" rx="19" fill="#301820" stroke="#fb7185"/><rect x="1110" y="295" width="220" height="170" rx="26" fill="#163529" stroke="#6ee7b7" stroke-width="4"/></g><g fill="#f0f7ff" font-size="22" font-weight="700"><text x="112" y="252">SPECIFICATION</text><text x="112" y="482">GOVERNANCE</text><text x="447" y="197">SCALABLE</text><text x="447" y="226">OVERSIGHT</text><text x="447" y="537">DEPLOYMENT</text><text x="447" y="566">CONTROLS</text><text x="802" y="197">INTERPRETABILITY</text><text x="802" y="537">EVALUATIONS</text><text x="1142" y="348">ASSURANCE</text><text x="1142" y="381">CASE</text></g><g fill="#a9bdd3" font-size="16"><text x="112" y="286">invariants · authority</text><text x="112" y="516">audit · thresholds</text><text x="447" y="257">decomposition · critique</text><text x="447" y="597">leases · rollback</text><text x="802" y="257">causal mechanisms</text><text x="802" y="597">red team · holdouts</text><text x="1142" y="415">conditional confidence</text><text x="1142" y="440">not certainty</text></g></g><g fill="none" stroke="#5b7793" stroke-width="4"><path d="M295 265h120"/><path d="M295 495h120"/><path d="M650 210h120"/><path d="M650 550h120"/><path d="M1005 210c48 10 56 104 105 140"/><path d="M1005 550c48-10 56-104 105-140"/></g><g fill="#5b7793"><path d="M405 258l18 7-18 7z"/><path d="M405 488l18 7-18 7z"/><path d="M760 203l18 7-18 7z"/><path d="M760 543l18 7-18 7z"/><path d="M1098 338l17 11-20 4z"/><path d="M1098 422l17-11-20-4z"/></g><text x="70" y="700" fill="#8299b4" font-family="Inter,Arial" font-size="17">A failure at any layer must reduce authority or trigger investigation; confidence is earned by independent, current evidence.</text></svg>
