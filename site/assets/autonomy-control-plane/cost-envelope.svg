<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="t d"><title id="t">Illustrative cost envelope for a hundred-round coding run</title><desc id="d">Bar chart comparing no cache, ninety percent cache, and compacted context assumptions at stated Qwen prices.</desc><rect width="1400" height="780" rx="28" fill="#08111f"/><text x="70" y="78" fill="#eef4ff" font-family="Inter,Arial" font-size="34" font-weight="700">Context policy dominates the token bill</text><text x="70" y="116" fill="#8fa6c0" font-family="Inter,Arial" font-size="17">Illustrative 100-round workload · same 2M output tokens · not an observed Qwen run</text>
<g stroke="#243951" stroke-width="2"><path d="M170 620h1070"/><path d="M170 520h1070"/><path d="M170 420h1070"/><path d="M170 320h1070"/><path d="M170 220h1070"/></g><g fill="#7890aa" font-family="Inter,Arial" font-size="16" text-anchor="end"><text x="150" y="626">$0</text><text x="150" y="526">$13</text><text x="150" y="426">$26</text><text x="150" y="326">$39</text><text x="150" y="226">$52</text></g>
<g font-family="Inter,Arial" text-anchor="middle"><rect x="270" y="220" width="200" height="400" rx="16" fill="#ef4444" opacity=".78"/><text x="370" y="197" fill="#fecaca" font-size="25" font-weight="700">$52.00</text><text x="370" y="662" fill="#d9e4f2" font-size="18">20M fresh input</text><text x="370" y="690" fill="#8299b3" font-size="16">no cache</text><rect x="600" y="462" width="200" height="158" rx="16" fill="#8b5cf6" opacity=".82"/><text x="700" y="438" fill="#ddd6fe" font-size="25" font-weight="700">$20.50</text><text x="700" y="662" fill="#d9e4f2" font-size="18">18M cached + 2M fresh</text><text x="700" y="690" fill="#8299b3" font-size="16">90% cache</text><rect x="930" y="491" width="200" height="129" rx="16" fill="#10b981" opacity=".85"/><text x="1030" y="467" fill="#a7f3d0" font-size="25" font-weight="700">$16.75</text><text x="1030" y="662" fill="#d9e4f2" font-size="18">3M cached + 2M fresh</text><text x="1030" y="690" fill="#8299b3" font-size="16">compacted</text></g><text x="70" y="742" fill="#7890aa" font-family="Inter,Arial" font-size="16">Formula: fresh input × $2/M + cached input × $0.25/M + output × $6/M</text></svg>
