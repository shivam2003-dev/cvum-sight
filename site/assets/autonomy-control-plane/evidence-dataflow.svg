<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Evidence carrying execution data flow</title><desc id="desc">Every proposed action becomes an intent envelope, policy decision, execution receipt, observation, verification claim, and committed state transition.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#07101d"/><stop offset="1" stop-color="#11172a"/></linearGradient><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#5eead4"/></marker><style>.h{font:700 34px Inter,system-ui;fill:#f7fbff}.s{font:500 17px Inter,system-ui;fill:#a9b8ca}.n{font:700 16px ui-monospace,monospace;fill:#5eead4}.t{font:700 20px Inter,system-ui;fill:#f2f6fd}.b{font:500 15px Inter,system-ui;fill:#b6c2d1}.c{fill:#101c2f;stroke:#334762;stroke-width:2}.a{fill:none;stroke:#5eead4;stroke-width:3;marker-end:url(#m)}</style></defs>
  <rect width="1400" height="800" rx="30" fill="url(#bg)"/><text class="h" x="65" y="75">Evidence-carrying execution</text><text class="s" x="65" y="110">A successful tool call is not completion; it is one claim in a verifiable chain</text>
  <g transform="translate(55 190)"><rect class="c" width="185" height="170" rx="20"/><text class="n" x="22" y="37">01</text><text class="t" x="22" y="73">Intent</text><text class="b" x="22" y="105">goal revision</text><text class="b" x="22" y="130">expected effect</text><text class="b" x="22" y="153">risk class</text></g>
  <g transform="translate(270 190)"><rect class="c" width="185" height="170" rx="20"/><text class="n" x="22" y="37">02</text><text class="t" x="22" y="73">Decision</text><text class="b" x="22" y="105">policy result</text><text class="b" x="22" y="130">capability lease</text><text class="b" x="22" y="153">approval binding</text></g>
  <g transform="translate(485 190)"><rect class="c" width="185" height="170" rx="20"/><text class="n" x="22" y="37">03</text><text class="t" x="22" y="73">Execution</text><text class="b" x="22" y="105">idempotency key</text><text class="b" x="22" y="130">tool inputs</text><text class="b" x="22" y="153">resource bounds</text></g>
  <g transform="translate(700 190)"><rect class="c" width="185" height="170" rx="20"/><text class="n" x="22" y="37">04</text><text class="t" x="22" y="73">Receipt</text><text class="b" x="22" y="105">exit status</text><text class="b" x="22" y="130">artifact digest</text><text class="b" x="22" y="153">side effects</text></g>
  <g transform="translate(915 190)"><rect class="c" width="185" height="170" rx="20"/><text class="n" x="22" y="37">05</text><text class="t" x="22" y="73">Verification</text><text class="b" x="22" y="105">independent oracle</text><text class="b" x="22" y="130">freshness</text><text class="b" x="22" y="153">coverage</text></g>
  <g transform="translate(1130 190)"><rect width="215" height="170" rx="20" fill="#17202e" stroke="#ffb454" stroke-width="2"/><text x="22" y="37" font-family="ui-monospace,monospace" font-size="16" font-weight="700" fill="#ffb454">06</text><text class="t" x="22" y="73">Commit state</text><text class="b" x="22" y="105">proven transition</text><text class="b" x="22" y="130">rollback pointer</text><text class="b" x="22" y="153">next precondition</text></g>
  <path class="a" d="M240 275H260"/><path class="a" d="M455 275H475"/><path class="a" d="M670 275H690"/><path class="a" d="M885 275H905"/><path class="a" d="M1100 275H1120"/>
  <path class="a" d="M1238 370C1238 520 1080 590 710 590C340 590 145 520 145 370"/>
  <text class="s" x="510" y="630">The next action consumes the prior proof, not the model’s memory of it.</text>
  <rect x="65" y="680" width="1270" height="70" rx="16" fill="#0d1828" stroke="#2d4059"/><text class="t" x="95" y="710">Minimal receipt tuple</text><text x="330" y="711" font-family="ui-monospace,monospace" font-size="16" fill="#9fe8dd">{intent_hash, policy_rev, actor, tool, inputs_hash, result_hash, verifier, timestamp, parent}</text><text class="b" x="95" y="736">Receipts must be bounded and secret-safe, while their hashes bind them to richer artifacts stored elsewhere.</text>
</svg>
