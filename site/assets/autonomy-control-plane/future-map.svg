<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="t d"><title id="t">Research frontier for long-horizon autonomy</title><desc id="d">A map from durable present-day controls to speculative future agent systems.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#1a1230"/></linearGradient></defs><rect width="1400" height="780" rx="28" fill="url(#bg)"/><text x="70" y="76" fill="#eef4ff" font-family="Inter,Arial" font-size="34" font-weight="700">The next frontier is governance that learns without rewriting its constitution</text><g font-family="Inter,Arial"><path d="M120 630C330 550 345 445 565 430S850 320 1030 280s220-135 300-160" fill="none" stroke="#364f6d" stroke-width="15" stroke-linecap="round"/><circle cx="160" cy="606" r="22" fill="#38bdf8"/><text x="105" y="665" fill="#bae6fd" font-size="18">durable replay</text><circle cx="405" cy="475" r="22" fill="#34d399"/><text x="330" y="530" fill="#a7f3d0" font-size="18">evidence contracts</text><circle cx="655" cy="404" r="22" fill="#fbbf24"/><text x="570" y="365" fill="#fde68a" font-size="18">shadow agents</text><circle cx="900" cy="321" r="22" fill="#a78bfa"/><text x="795" y="278" fill="#ddd6fe" font-size="18">causal memory</text><circle cx="1165" cy="206" r="22" fill="#f472b6"/><text x="1050" y="164" fill="#fbcfe8" font-size="18">institutional autonomy</text>
<rect x="72" y="145" width="330" height="170" rx="20" fill="#0c2135" stroke="#38bdf8"/><text x="105" y="190" fill="#7dd3fc" font-size="18">NOW</text><text x="105" y="232" fill="#eef4ff" font-size="20">checkpoints · leases</text><text x="105" y="268" fill="#eef4ff" font-size="20">policy gates · rollback</text><rect x="535" y="525" width="350" height="165" rx="20" fill="#262015" stroke="#fbbf24"/><text x="570" y="570" fill="#fde68a" font-size="18">NEAR TERM</text><text x="570" y="612" fill="#eef4ff" font-size="20">counterfactual verification</text><text x="570" y="648" fill="#eef4ff" font-size="20">risk-priced computation</text><rect x="1000" y="405" width="330" height="190" rx="20" fill="#291936" stroke="#e879f9"/><text x="1035" y="450" fill="#f0abfc" font-size="18">OPEN RESEARCH</text><text x="1035" y="492" fill="#eef4ff" font-size="20">safe goal revision</text><text x="1035" y="528" fill="#eef4ff" font-size="20">cross-domain evidence</text><text x="1035" y="564" fill="#eef4ff" font-size="20">longitudinal evaluation</text></g><text x="70" y="738" fill="#8097b2" font-family="Inter,Arial" font-size="16">Learning may tune tactics and budgets; changing authority, invariants, or safety policy requires a separate governed path.</text></svg>
