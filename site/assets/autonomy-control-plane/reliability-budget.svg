<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Reliability budget for long autonomous runs</title><desc id="desc">Shows how small uncorrected per-step errors compound and how verification gates reset uncertainty.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#07101c"/><stop offset="1" stop-color="#12172a"/></linearGradient><style>.h{font:700 34px Inter,system-ui;fill:#f7fbff}.s{font:500 17px Inter,system-ui;fill:#a9b7ca}.t{font:700 20px Inter,system-ui;fill:#f2f7ff}.b{font:500 15px Inter,system-ui;fill:#b6c2d1}.mono{font:600 18px ui-monospace,monospace;fill:#8ff0de}.axis{stroke:#43536a;stroke-width:2}.risk{fill:none;stroke:#ff6b8a;stroke-width:5}.gate{stroke:#5eead4;stroke-width:3;stroke-dasharray:8 7}.safe{fill:none;stroke:#5eead4;stroke-width:5}</style></defs>
  <rect width="1400" height="820" rx="30" fill="url(#bg)"/><text class="h" x="65" y="75">A ten-day run is a reliability product, not a duration metric</text><text class="s" x="65" y="110">Without detection and repair, tiny local error rates dominate global success</text>
  <rect x="65" y="155" width="1270" height="470" rx="22" fill="#0c1728" stroke="#2e4059"/>
  <line class="axis" x1="140" y1="545" x2="1260" y2="545"/><line class="axis" x1="140" y1="220" x2="140" y2="545"/>
  <text class="b" x="111" y="568">0</text><text class="b" x="585" y="578">250 dependent steps</text><text class="b" x="1100" y="578">500 dependent steps</text><text class="b" x="90" y="230">1.0</text><text class="b" x="90" y="540">0.0</text>
  <path class="risk" d="M140 225 C310 285 470 340 620 402 S950 500 1260 535"/>
  <text x="955" y="505" font-family="Inter,system-ui" font-size="16" fill="#ff8ba2">uncorrected chain</text>
  <path class="safe" d="M140 225 C220 255 265 285 310 320 L310 245 C390 270 435 305 480 330 L480 250 C560 275 605 310 650 335 L650 250 C730 275 775 310 820 335 L820 250 C900 275 945 310 990 335 L990 250 C1070 275 1120 310 1160 335 L1160 255 C1200 270 1235 290 1260 310"/>
  <line class="gate" x1="310" y1="205" x2="310" y2="545"/><line class="gate" x1="480" y1="205" x2="480" y2="545"/><line class="gate" x1="650" y1="205" x2="650" y2="545"/><line class="gate" x1="820" y1="205" x2="820" y2="545"/><line class="gate" x1="990" y1="205" x2="990" y2="545"/><line class="gate" x1="1160" y1="205" x2="1160" y2="545"/>
  <text x="900" y="290" font-family="Inter,system-ui" font-size="16" fill="#7be8d8">gated chain with repair</text>
  <rect x="65" y="660" width="605" height="110" rx="18" fill="#111d30" stroke="#34465f"/><text class="t" x="95" y="699">Naive composition</text><text class="mono" x="95" y="731">P(success) = ∏ᵢ (1 − pᵢ)</text><text class="b" x="95" y="756">At p = 0.5%, 500 unchecked steps survive with probability ≈ 8.2%.</text>
  <rect x="700" y="660" width="635" height="110" rx="18" fill="#111d30" stroke="#34465f"/><text class="t" x="730" y="699">Budgeted autonomy</text><text class="mono" x="730" y="731">R = Σᵢ severityᵢ · escape_probᵢ ≤ Rₘₐₓ</text><text class="b" x="730" y="756">Spend verification where errors are costly or hard to observe—not uniformly.</text>
</svg>
